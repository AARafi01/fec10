<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DU Crack{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>

    {% block navigation %}{% endblock %}

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script>
        function showToast(message, type = 'info') {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            toast.className = 'premium-toast';
            
            // Dynamic premium icon matching
            let icon = '<i class="fas fa-info-circle text-info"></i>';
            if (type === 'success') {
                icon = '<i class="fas fa-check-circle" style="color: #8BDFDD;"></i>';
            } else if (type === 'error' || type === 'danger') {
                icon = '<i class="fas fa-exclamation-circle text-danger"></i>';
            } else if (type === 'warning') {
                icon = '<i class="fas fa-exclamation-triangle text-warning"></i>';
            }
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            // Micro-interaction trigger
            setTimeout(() => {
                toast.classList.add('show');
            }, 50);
            
            // Auto dismissal
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                    if (container.children.length === 0) {
                        container.remove();
                    }
                }, 300);
            }, 3000);
        }

        // Automatic page-load flashed message to toast pipeline
        document.addEventListener('DOMContentLoaded', function() {
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
                showToast("{{ message }}", "{{ category }}");
            {% endfor %}
            {% endif %}
            {% endwith %}
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
