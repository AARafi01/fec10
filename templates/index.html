<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU Crack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #2F1B72 0%, #1a0f42 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-2px);
            transition: all 0.3s;
        }
        .results-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .table thead {
            background: #2F1B72;
            color: white;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .cgpa-badge {
            font-size: 1.1em;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .cgpa-excellent {
            background: #d4edda;
            color: #155724;
        }
        .cgpa-good {
            background: #d1ecf1;
            color: #0c5460;
        }
        .cgpa-average {
            background: #fff3cd;
            color: #856404;
        }
        .cgpa-poor {
            background: #f8d7da;
            color: #721c24;
        }
        .admin-link {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .serial-col {
            width: 60px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% if session.logged_in %}
    <a href="/admin" class="btn btn-light admin-link">
        <i class="fas fa-cog"></i> Admin Panel
    </a>
    {% else %}
    <a href="/login" class="btn btn-light admin-link">
        <i class="fas fa-sign-in-alt"></i> Admin Login
    </a>
    {% endif %}

    <div class="main-container">
        <div class="card">
            <div class="card-header text-center">
                <h1><i class="fas fa-graduation-cap"></i> DUCMC Got Hacked !!</h1>
            </div>
            <div class="card-body p-4">
                <form id="examForm">
                    <div class="form-group mb-3">
                        <label for="exam_id" class="form-label"><strong>Exam Name</strong></label>
                        <select class="form-control form-select" id="exam_id" style="cursor: pointer;" required>
                            <option value="">-- Select Exam --</option>
                            {% for exam in exams %}
                            <option value="{{ exam.exam_id }}">{{ exam.exam_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-search"></i> See Result
                        </button>
                    </div>
                </form>

                <div class="loading" id="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3"><strong>Processing results... Please wait.</strong></p>
                    <p class="text-muted">This may take a few minutes depending on the number of students.</p>
                </div>
            </div>
        </div>

        <div id="resultsContainer" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-table"></i> <span id="examTitle"></span> (Sorted) </h3>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="resultsTable">
                            <thead>
                                <tr>
                                    <th class="serial-col">Serial</th>
                                    <th>Registration No</th>
                                    <th>Student Name</th>
                                    <th>CGPA</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Subject Details Modal -->
    <div class="modal fade" id="subjectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: #2F1B72; color: white;">
                    <h5 class="modal-title"><i class="fas fa-book"></i> Subject Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="subjectDetails">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('examForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const examId = document.getElementById('exam_id').value;
            
            if (!examId) {
                alert('Please select an exam');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsContainer').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('exam_id', examId);

                const response = await fetch('/process_results', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }


                // Display results
                displayResults(data.results, examId);

            } catch (error) {
                alert('Error processing results: ' + error.message);
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function displayResults(results, examId) {
            const examSelect = document.getElementById('exam_id');
            const examTitle = examSelect.options[examSelect.selectedIndex].text;
            document.getElementById('examTitle').textContent = examTitle;

            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            results.forEach((result, index) => {
                const row = document.createElement('tr');
                
                const cgpaValue = result.cgpa || 0;
                let cgpaClass = 'cgpa-poor';
                if (cgpaValue >= 3.5) cgpaClass = 'cgpa-excellent';
                else if (cgpaValue >= 3.0) cgpaClass = 'cgpa-good';
                else if (cgpaValue >= 2.5) cgpaClass = 'cgpa-average';

                row.innerHTML = `
                    <td class="serial-col">${index + 1}</td>
                    <td>${result.registration}</td>
                    <td>${result.name || result.error || 'N/A'}</td>
                    <td><span class="cgpa-badge ${cgpaClass}">${cgpaValue.toFixed(2)}</span></td>
                    <td>${result.status || 'Error'}</td>
                    <td>
                        ${result.subjects ? `
                            <button class="btn btn-sm btn-info" onclick='showSubjects(${JSON.stringify(result.subjects)})'>
                                <i class="fas fa-eye"></i> View Subjects
                            </button>
                        ` : '<span class="text-muted">N/A</span>'}
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('resultsContainer').style.display = 'block';
            document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function showSubjects(subjects) {
            const detailsDiv = document.getElementById('subjectDetails');
            
            let html = '<table class="table table-striped"><thead><tr><th>SL</th><th>Code</th><th>Subject Name</th><th>Grade</th><th>Point</th></tr></thead><tbody>';
            
            subjects.forEach(subject => {
                html += `
                    <tr>
                        <td>${subject.sl}</td>
                        <td>${subject.code}</td>
                        <td>${subject.name}</td>
                        <td><strong>${subject.grade}</strong></td>
                        <td>${subject.point}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            detailsDiv.innerHTML = html;
            
            const modal = new bootstrap.Modal(document.getElementById('subjectModal'));
            modal.show();
        }
    </script>
</body>
</html>
