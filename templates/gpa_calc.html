<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #2F1B72 0%, #1a0f42 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .gpa-result {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 20px;
        }
        .admin-link {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <a href="/admin" class="btn btn-light admin-link">
        <i class="fas fa-cog"></i> Admin Panel
    </a>
    <div class="main-container">
        <div class="card">
            <div class="card-header text-center">
                <h1><i class="fas fa-calculator"></i> GPA Calculator</h1>
            </div>
            <div class="card-body">
                <form id="gpaForm">
                    <div class="mb-3">
                        <label for="semester" class="form-label"><strong>Select Semester</strong></label>
                        <select class="form-select" id="semester" required>
                            <option value="">-- Select Semester --</option>
                        </select>
                    </div>
                    <div id="coursesTableContainer"></div>
                </form>
                <div class="gpa-result text-center" id="gpaResult" style="display:none;"></div>
            </div>
        </div>
    </div>
    <script>
        // Courses data (should match backend)
        const coursesData = {};
        // Will be filled by backend
        fetch('/api/gpa_courses')
            .then(res => res.json())
            .then(data => {
                Object.assign(coursesData, data);
                const semesterSelect = document.getElementById('semester');
                Object.keys(coursesData).forEach(sem => {
                    const opt = document.createElement('option');
                    opt.value = sem;
                    opt.textContent = sem;
                    semesterSelect.appendChild(opt);
                });
            });

        document.getElementById('semester').addEventListener('change', function() {
            const semester = this.value;
            const container = document.getElementById('coursesTableContainer');
            container.innerHTML = '';
            document.getElementById('gpaResult').style.display = 'none';
            if (!semester || !coursesData[semester]) return;
            const courses = coursesData[semester];
            let html = '<table class="table table-bordered"><thead><tr><th>Code</th><th>Title</th><th>Credit</th><th>GPA</th></tr></thead><tbody>';
            courses.forEach((course, idx) => {
                html += `<tr>
                    <td><input type="text" class="form-control" value="${course.code}" readonly></td>
                    <td><input type="text" class="form-control" value="${course.title}" readonly></td>
                    <td><input type="number" class="form-control" value="${course.credit}" readonly></td>
                    <td><input type="number" min="0" max="4" step="0.01" class="form-control gpa-input" data-idx="${idx}" value="0.00"></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            document.querySelectorAll('.gpa-input').forEach(input => {
                input.addEventListener('input', updateGPA);
            });
        });

        function updateGPA() {
            const semester = document.getElementById('semester').value;
            if (!semester || !coursesData[semester]) return;
            const courses = coursesData[semester];
            let totalPoints = 0, totalCredits = 0;
            document.querySelectorAll('.gpa-input').forEach((input, idx) => {
                let gpa = parseFloat(input.value);
                if (isNaN(gpa)) gpa = 0.0;
                const credit = parseFloat(courses[idx].credit);
                totalPoints += gpa * credit;
                totalCredits += credit;
            });
            let gpa = totalCredits ? (totalPoints / totalCredits) : 0.0;
            document.getElementById('gpaResult').textContent = `Semester GPA: ${gpa.toFixed(2)}`;
            document.getElementById('gpaResult').style.display = 'block';
        }
    </script>
</body>
</html>
