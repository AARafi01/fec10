name: Scheduled Scrape

on:
  workflow_dispatch:
    inputs:
      exam_id:
        description: 'Exam ID to scrape'
        required: false
        default: ''
  schedule:
    # Runs at 03:00 UTC on the 1st of every month (adjust as needed)
    - cron: '0 3 1 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper worker
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          PROGRAM_ID: '14'
          SESSION_ID: '23'
        run: |
          EXAM_TO_RUN="${{ github.event.inputs.exam_id || secrets.DEFAULT_EXAM_ID || '' }}"
          if [ -z "$EXAM_TO_RUN" ]; then
            echo "No exam_id provided. Exiting."
            exit 0
          fi
          python scraper_worker.py --exam-id "$EXAM_TO_RUN" --input-file sample_registrations.txt || true
