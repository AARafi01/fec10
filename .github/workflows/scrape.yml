name: Manual Scrape

on:
  workflow_dispatch:
    inputs:
      exam_id:
        description: 'Exam ID to scrape'
        required: true
        default: ''
      input_file:
        description: 'Path to registration list'
        required: false
        default: 'sample_registrations.txt'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper worker
        env:
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          PROGRAM_ID: '14'
          SESSION_ID: '23'
        run: |
          if [ -z "${{ github.event.inputs.exam_id }}" ]; then
            echo "exam_id is required for manual scraping"
            exit 1
          fi
          python scraper_worker.py \
            --exam-id "${{ github.event.inputs.exam_id }}" \
            --input-file "${{ github.event.inputs.input_file }}" \
            --min-delay 0.75 \
            --max-delay 2.0 || true
